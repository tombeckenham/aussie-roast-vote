  </text>
  
  <!-- Stars from Southern Cross -->
  <g fill="#FFFFFF">
    <circle cx="960" cy="120" r="15"/>
    <circle cx="1020" cy="160" r="12"/>
    <circle cx="990" cy="200" r="18"/>
    <circle cx="1040" cy="220" r="10"/>
    <circle cx="980" cy="260" r="14"/>
  </g>
  
  <!-- Website URL -->
  <text x="600" y="520" font-family="Arial, sans-serif" font-size="28" font-weight="normal" text-anchor="middle" fill="#6c757d">
