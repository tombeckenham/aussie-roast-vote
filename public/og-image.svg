<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#f8f9fa"/>
  
  <!-- Australian flag colors as decorative elements -->
  <rect x="0" y="0" width="1200" height="20" fill="#00008B"/>
  <rect x="0" y="610" width="1200" height="20" fill="#00008B"/>
  <rect x="0" y="0" width="20" height="630" fill="#00008B"/>
  <rect x="1180" y="0" width="20" height="630" fill="#00008B"/>
  
  <!-- Gold accent -->
  <rect x="40" y="40" width="1120" height="10" fill="#FFCD00"/>
  <rect x="40" y="580" width="1120" height="10" fill="#FFCD00"/>
  
  <!-- Main title -->
  <text x="600" y="180" font-family="Arial, sans-serif" font-size="72" font-weight="bold" text-anchor="middle" fill="#343a40">
    Aussie How-to-vote
  </text>
  
  <!-- Subtitle -->
  <text x="600" y="260" font-family="Arial, sans-serif" font-size="48" font-weight="normal" text-anchor="middle" fill="#495057">
    2025 Election Guide
  </text>
  
  <!-- Description -->
  <text x="600" y="360" font-family="Arial, sans-serif" font-size="32" font-weight="normal" text-anchor="middle" fill="#495057">
